<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Search</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <a class="navbar-brand" href="/">Vulnerable Mart</a>
        <div class="navbar-nav">
            <a class="nav-item nav-link" href="/search">Search Products</a>
            <a class="nav-item nav-link" href="/cart">Cart</a>
        </div>
    </nav>

    <div class="container">
        <h2>Product Search</h2>
        <form action="/search" method="GET" class="form-inline mb-4">
            <input type="text" name="q" class="form-control mr-2" placeholder="Search for items..." value="{{ request.args.get('q', '') }}">
            <button type="submit" class="btn btn-primary">Search</button>
        </form>

        <div class="row">
            {% for item in items %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ item[0] }}</h5>
                        <p class="card-text text-muted">${{ item[1] }}</p>
                        <p class="card-text">{{ item[2] }}</p>
                        
                        <form action="/add_to_cart" method="POST">
                            <input type="hidden" name="item_id" value="{{ item[3] }}">
                            <button type="submit" class="btn btn-outline-primary btn-sm">Add to Cart</button>
                        </form>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
