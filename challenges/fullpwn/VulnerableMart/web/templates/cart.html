<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Shopping Cart</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <a class="navbar-brand" href="/">Vulnerable Mart</a>
        <div class="navbar-nav">
            <a class="nav-item nav-link" href="/search">Search Products</a>
            <a class="nav-item nav-link active" href="/cart">Cart</a>
        </div>
    </nav>

    <div class="container">
        <h2>Shopping Cart</h2>
        
        {% if items %}
            <table class="table table-bordered mt-3">
                <thead class="thead-light">
                    <tr>
                        <th>Product</th>
                        <th>Description</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in items %}
                    <tr>
                        <td>{{ item[0] }}</td>
                        <td>{{ item[2] }}</td>
                        <td>${{ item[1] }}</td>
                    </tr>
                    {% endfor %}
                    <tr>
                        <td colspan="2" class="text-right"><strong>Total:</strong></td>
                        <td><strong>${{ total }}</strong></td>
                    </tr>
                </tbody>
            </table>

            <div class="card mt-4">
                <div class="card-header bg-secondary text-white">Checkout</div>
                <div class="card-body">
                    <form action="/checkout" method="POST">
                        <div class="form-group">
                            <label>Have a Promo Code?</label>
                            <input type="text" name="promo_code" class="form-control" placeholder="Enter code here (e.g. SAVE10)">
                        </div>

                        <input type="hidden" name="promo_valid" value="false">

                        <button type="submit" class="btn btn-success btn-block">Complete Purchase</button>
                    </form>
                </div>
            </div>
        {% else %}
            <div class="alert alert-warning mt-4">Your cart is empty. <a href="/search">Go shopping!</a></div>
        {% endif %}
    </div>
</body>
</html>
