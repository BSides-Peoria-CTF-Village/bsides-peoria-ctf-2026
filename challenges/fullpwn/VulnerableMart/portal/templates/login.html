<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container" style="max-width: 440px; margin-top: 80px;">
        <h2 class="text-center mb-4">Seller Login</h2>
        {% if registered %}<div class="alert alert-success">Account created. Please log in.</div>{% endif %}
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="POST" action="/login" class="border p-4 bg-white shadow-sm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
        <p class="text-center mt-3 text-muted">No account? <a href="/register">Register with a key</a>.</p>
    </div>
</body>
</html>
