name: Build and Sync Changed Challenges

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  HARBOR_REGISTRY: harbor.bsidespeoriac.tf
  HARBOR_PROJECT: bsides-peoria-ctf
  CTFD_URL: ${{ secrets.CTFD_URL }}

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || git diff --name-only HEAD^ HEAD -- .github/workflows/build.yml 2>/dev/null | grep -q .; then
            CHANGED_FILES=$(git ls-files challenges)
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "Changed files:"
            git diff --name-only HEAD^ HEAD

            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED_FILES=$(find . -type f | sed 's#^\./##')
          fi

          CHALLENGES=$(
            printf '%s\n' "$CHANGED_FILES" \
              | awk -F/ '
                  /^challenges\/[^/]+\/[^/]+\// { print $2 "/" $3; next }
                  /^[^/.][^/]*\/[^/]+\// && $1 != ".github" { print $1 "/" $2; next }
                ' \
              | sort -u
          )

          JSON="["
          FIRST=true

          for CHAL in $CHALLENGES; do
            if [[ -d "challenges/$CHAL" ]]; then
              PATH_ON_DISK="challenges/$CHAL"
            else
              PATH_ON_DISK="$CHAL"
            fi

            YAML_FILES=()
            BUILD=false
            if [[ -f "$PATH_ON_DISK/Dockerfile" && -f "$PATH_ON_DISK/challenge.yaml" ]]; then
              YAML_FILES=("$PATH_ON_DISK/challenge.yaml")
              BUILD=true
            elif [[ -f "$PATH_ON_DISK/docker-compose.yml" && -d "$PATH_ON_DISK/challenges" ]]; then
              # One shared deployment, with an independently scored entry per flag.
              shopt -s nullglob
              YAML_FILES=("$PATH_ON_DISK"/challenges/*.yaml)
              shopt -u nullglob
            fi

            for YAML_FILE in "${YAML_FILES[@]}"; do
              CATEGORY=$(dirname "$CHAL" | tr '[:upper:]' '[:lower:]')
              SLUG=$(basename "$CHAL" | tr '[:upper:]' '[:lower:]')

              ITEM=$(jq -cn \
                --arg category "$CATEGORY" \
                --arg slug "$SLUG" \
                --arg path "$PATH_ON_DISK" \
                --arg yaml "$YAML_FILE" \
                --argjson build "$BUILD" \
                '{category:$category, slug:$slug, path:$path, yaml:$yaml, build:$build}')

              if [[ "$FIRST" == "true" ]]; then
                FIRST=false
              else
                JSON+=","
              fi

              JSON+="$ITEM"
            done
          done

          JSON+="]"
          echo "$JSON"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  build-and-sync:
    needs: detect

    if: ${{ needs.detect.outputs.matrix != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate shared deployment flags
        if: ${{ !matrix.build }}
        run: python3 "${{ matrix.path }}/sync_flags.py" --check

      - name: Log in to Harbor
        if: matrix.build
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        if: matrix.build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/Dockerfile
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.category }}/${{ matrix.slug }}:latest
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.category }}/${{ matrix.slug }}:${{ github.sha }}

      - name: Create or update CTFd challenge
        shell: bash
        env:
          CTFD_TOKEN: ${{ secrets.CTFD_TOKEN }}
          CATEGORY: ${{ matrix.category }}
          SLUG: ${{ matrix.slug }}
          YAML_FILE: ${{ matrix.yaml }}
          BUILD_IMAGE: ${{ matrix.build }}
          IMAGE: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.category }}/${{ matrix.slug }}:latest
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "$name is required"
              exit 1
            fi
          }

          require_secret CTFD_URL "$CTFD_URL"
          require_secret CTFD_TOKEN "$CTFD_TOKEN"

          # Secrets are commonly entered with a trailing slash. Normalize the
          # base URL so every API path below has exactly one separating slash.
          CTFD_URL="${CTFD_URL%/}"

          NAME=$(yq -r '.name // env(SLUG)' "$YAML_FILE")
          CATEGORY_FROM_YAML=$(yq -r '.category // env(CATEGORY)' "$YAML_FILE")
          DESCRIPTION=$(yq -r '.description // ""' "$YAML_FILE")
          FUNCTION=$(yq -r '.function // "logarithmic"' "$YAML_FILE")
          INITIAL=$(yq -r '.initial // .value // 500' "$YAML_FILE")
          MINIMUM=$(yq -r '.minimum // 100' "$YAML_FILE")
          DECAY=$(yq -r '.decay // 9' "$YAML_FILE")
          STATE=$(yq -r '.state // "visible"' "$YAML_FILE")
          MAX_ATTEMPTS=$(yq -r '.max_attempts // 0' "$YAML_FILE")
          ATTRIBUTION=$(yq -r '.attribution // ""' "$YAML_FILE")
          PREFIX=$(yq -r '.docker_container_prefix // "ctfd"' "$YAML_FILE")
          CONNECTION_SCHEME=$(yq -r '.connection_scheme // .docker_connection_scheme // ""' "$YAML_FILE")
          IMAGE_FROM_YAML=$(yq -r '.docker_image // ""' "$YAML_FILE")
          TYPE=docker
          if [[ "$BUILD_IMAGE" == "false" ]]; then
            TYPE=$(yq -r '.type // "dynamic"' "$YAML_FILE")
            echo "DEBUG: YAML_FILE=$YAML_FILE TYPE='$TYPE' IMAGE_FROM_YAML='$IMAGE_FROM_YAML'"
            if [[ "$TYPE" != "dynamic" ]]; then
              echo "Shared deployment scoring entries must use type: dynamic"
              exit 1
            fi
          fi

          if [[ -n "$IMAGE_FROM_YAML" && "$IMAGE_FROM_YAML" != "null" ]]; then
            IMAGE="$IMAGE_FROM_YAML"
          fi

          CTFD_HEADERS=$(mktemp)
          CTFD_BODY=$(mktemp)
          trap 'rm -f "$CTFD_HEADERS" "$CTFD_BODY"' EXIT

          echo "::group::CTFd challenge lookup debug"
          echo "CTFd base URL: $CTFD_URL"
          echo "CTFd API URL: $CTFD_URL/api/v1/challenges"
          echo "CTFd token length: ${#CTFD_TOKEN}"

          if ! CTFD_CURL_INFO=$(curl -sS \
            -D "$CTFD_HEADERS" \
            -o "$CTFD_BODY" \
            -w 'http_code=%{http_code} content_type=%{content_type} url=%{url_effective} redirects=%{num_redirects}' \
            -H "Authorization: Token $CTFD_TOKEN" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$CTFD_URL/api/v1/challenges"); then
            echo "curl failed while looking up CTFd challenges"
            exit 1
          fi

          echo "curl: $CTFD_CURL_INFO"
          echo "response bytes: $(wc -c < "$CTFD_BODY")"
          echo "response headers (safe subset):"
          grep -Ei '^(HTTP/|content-type:|location:|server:|cf-ray:)' "$CTFD_HEADERS" || true

          if ! jq -e 'type == "object"' "$CTFD_BODY" >/dev/null; then
            echo "CTFd returned a non-JSON response (first 1000 bytes):"
            head -c 1000 "$CTFD_BODY"
            echo
            exit 1
          fi

          echo "JSON summary: $(jq -c '{success, data_type: (.data | type), data_count: (if (.data | type) == "array" then (.data | length) else null end)}' "$CTFD_BODY")"
          echo "::endgroup::"

          EXISTING_ID=$(jq -r --arg name "$NAME" --arg category "$CATEGORY_FROM_YAML" '
              .data[]
              | select(.name == $name and .category == $category)
              | .id
            ' "$CTFD_BODY" | head -n1)

          PAYLOAD=$(
            jq -n \
              --arg name "$NAME" \
              --arg category "$CATEGORY_FROM_YAML" \
              --arg description "$DESCRIPTION" \
              --arg state "$STATE" \
              --arg attribution "$ATTRIBUTION" \
              --arg image "$IMAGE" \
              --arg prefix "$PREFIX" \
              --arg connection_scheme "$CONNECTION_SCHEME" \
              --arg function "$FUNCTION" \
              --arg type "$TYPE" \
              --argjson initial "$INITIAL" \
              --argjson minimum "$MINIMUM" \
              --argjson decay "$DECAY" \
              --argjson max_attempts "$MAX_ATTEMPTS" \
              '{
                name: $name,
                category: $category,
                description: $description,
                value: $initial,
                function: $function,
                initial: $initial,
                minimum: $minimum,
                decay: $decay,
                state: $state,
                max_attempts: $max_attempts,
                attribution: $attribution,
                type: $type,
                docker_image: $image,
                docker_container_prefix: $prefix,
                docker_connection_scheme: $connection_scheme
              } | if .type == "dynamic" then del(.docker_image, .docker_container_prefix, .docker_connection_scheme) else . end'
          )

          if [[ -z "$EXISTING_ID" ]]; then
            echo "Creating CTFd challenge: $CATEGORY_FROM_YAML/$NAME"
            CHALLENGE_CREATED=true
            RESPONSE=$(
              curl -sS -X POST \
                -H "Authorization: Token $CTFD_TOKEN" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$CTFD_URL/api/v1/challenges"
            )
          else
            echo "Updating CTFd challenge #$EXISTING_ID: $CATEGORY_FROM_YAML/$NAME"
            CHALLENGE_CREATED=false
            RESPONSE=$(
              curl -sS -X PATCH \
                -H "Authorization: Token $CTFD_TOKEN" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$CTFD_URL/api/v1/challenges/$EXISTING_ID"
            )
          fi

          echo "$RESPONSE" | jq .

          if [[ "$(echo "$RESPONSE" | jq -r '.success')" != "true" ]]; then
            echo "CTFd challenge sync failed"
            exit 1
          fi

          CHALLENGE_ID=$(echo "$RESPONSE" | jq -r '.data.id')
          FLAGS_JSON=$(
            {
              yq -r '.flags[]? // ""' "$YAML_FILE"
              yq -r '.flag // ""' "$YAML_FILE"
            } \
              | sed '/^$/d' \
              | jq -R . \
              | jq -s .
          )

          if [[ ( "$CHALLENGE_CREATED" == "true" || "$TYPE" == "dynamic" ) && "$(echo "$FLAGS_JSON" | jq 'length')" -gt 0 ]]; then
            echo "Replacing flags for challenge #$CHALLENGE_ID"

            EXISTING_FLAGS=$(
              curl -sS \
                -H "Authorization: Token $CTFD_TOKEN" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                "$CTFD_URL/api/v1/flags" \
                | jq -r --argjson challenge_id "$CHALLENGE_ID" '
                    .data[]
                    | select(.challenge_id == $challenge_id)
                    | .id
                  '
            )

            for FLAG_ID in $EXISTING_FLAGS; do
              curl --fail-with-body -sS -X DELETE \
                -H "Authorization: Token $CTFD_TOKEN" \
                -H "Accept: application/json" \
                "$CTFD_URL/api/v1/flags/$FLAG_ID" \
                | jq -e '.success == true'
            done

            echo "$FLAGS_JSON" | jq -r '.[]' | while IFS= read -r FLAG; do
              FLAG_PAYLOAD=$(
                jq -n \
                  --argjson challenge_id "$CHALLENGE_ID" \
                  --arg content "$FLAG" \
                  '{
                    challenge_id: $challenge_id,
                    type: "static",
                    content: $content,
                    data: "case_insensitive"
                  }'
              )

              curl --fail-with-body -sS -X POST \
                -H "Authorization: Token $CTFD_TOKEN" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                -d "$FLAG_PAYLOAD" \
                "$CTFD_URL/api/v1/flags" \
                | jq -e '.success == true'
            done
          elif [[ "$(echo "$FLAGS_JSON" | jq 'length')" -gt 0 ]]; then
            echo "CTFd challenge #$CHALLENGE_ID already exists; leaving its flags unchanged."
          else
            echo "No flag or flags configured in $YAML_FILE; leaving existing CTFd flags unchanged."
          fi
